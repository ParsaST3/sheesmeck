<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دنیای مگس</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1f1c;--panel:rgba(13,31,28,.82);--fg:#e6f0e4;--mut:#8fae a3;--food:#f2a93b;--threat:#e5484d;--calm:#6fcf97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--mut:#8faea3}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Vazirmatn,Tahoma,sans-serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:8px;left:8px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.box{background:var(--panel);border-radius:10px;padding:8px 12px;font-size:13px;pointer-events:auto;backdrop-filter:blur(6px)}
.bar{width:110px;height:6px;background:#ffffff22;border-radius:3px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .2s}
#ctl{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));right:8px;left:8px;display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:13px;color:var(--fg);background:var(--panel);border:1px solid #ffffff33;border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--calm)}
</style>
</head>
<body>
<div id="hud">
  <div class="box"><div>گرسنگی</div><div class="bar"><i id="bh" style="background:var(--food)"></i></div></div>
  <div class="box"><div>تشنگی</div><div class="bar"><i id="bt" style="background:#3a8fd0"></i></div></div>
  <div class="box"><div>خستگی</div><div class="bar"><i id="bfat" style="background:#a78bfa"></i></div></div>
  <div class="box"><div>سلامتی</div><div class="bar"><i id="bhp" style="background:var(--calm)"></i></div></div>
  <div class="box"><div>ترس</div><div class="bar"><i id="bf" style="background:var(--threat)"></i></div></div>
  <div class="box">حالت: <b id="st">کاوش</b> · نسل: <b id="gen">1</b> · سن: <b id="age">0</b>ث · غذاخورده: <b id="ea">0</b></div>
  <div class="box">Kenyon cells فعال: <b id="kc">0</b>/<b id="kcTotal">40</b> · Giant Fiber: <b id="gf">-</b></div>
  <div class="box" id="brainStatus" role="status">برای شروع، فایل شبکهٔ FlyWire را بارگذاری کن</div>
  <div class="box">اسپایک کل شبکه (این فریم): <b id="totalSp">-</b></div>
</div>
<div id="ctl">
  <button id="b1">غذای جدید</button>
  <button id="b2">تهدید را نزدیک بیاور</button>
  <button id="b3">دنبال کردن مگس: روشن</button>
  <label class="box" style="cursor:pointer">
    بارگذاری شبکهٔ FlyWire (JSON یا FLYC)
    <input id="brainFile" type="file" accept=".json,.flyc" style="display:none">
  </label>
</div>

// Real CC0 low-poly nature models by flo-bit (github.com/flo-bit/low-poly-asset-packs), embedded as base64 glb.
const gltfLoader = new THREE.GLTFLoader();
const modelCache = {};
function loadModel(name, onReady){
  if(modelCache[name]){onReady(modelCache[name].clone(true));return;}
  const bin = atob(ASSET_B64[name]);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
  gltfLoader.parse(buf.buffer, '', gltf=>{
    gltf.scene.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
    modelCache[name]=gltf.scene;
    onReady(gltf.scene.clone(true));
  }, err=>console.warn('model load failed',name,err));
}

const vel=V(0,0,1), st={hunger:.3,thirst:.2,fatigue:0,fear:0,health:1,age:0,eaten:0,drunk:0,gen:1,asleep:false,follow:true};
const LIFESPAN=180; // seconds of simulated life per generation
const trail=[]; const tg=new THREE.BufferGeometry(); const tl=new THREE.Line(tg,new THREE.LineBasicMaterial({color:0x6fcf97,transparent:true,opacity:.5})); scene.add(tl);

// ---- Sensors: what the fly "perceives" ----
function sense(){
  const p=fly.position, fwd=vel.clone().normalize();
  const right=V().crossVectors(fwd,V(0,1,0)).normalize();
  const odor=q=>foods.reduce((s,f)=>s+Math.exp(-q.distanceTo(f.position)/6),0);
  const aL=p.clone().addScaledVector(right,-.4), aR=p.clone().addScaledVector(right,.4); // antennae
  const lightDir=sun.position.clone().sub(p).normalize();
  const threatD=p.distanceTo(spider.position);
  let obsPush=V(0,0,0);
  obs.forEach(o=>{const dx=p.x-o.x,dz=p.z-o.z,d=Math.hypot(dx,dz)-o.r;if(d<3)obsPush.add(V(dx,0,dz).normalize().multiplyScalar((3-d)/3));});
  const wall=V(0,0,0);
  ['x','z'].forEach(a=>{if(p[a]>W-3)wall[a]-=1;if(p[a]<-W+3)wall[a]+=1;});
  if(p.y<1)wall.y+=1; if(p.y>9)wall.y-=1;
  const waterDH=Math.hypot(p.x-water.position.x,p.z-water.position.z); // distance to pond center
  const waterEdgeD=Math.max(0,waterDH-WATER_R); // measure from the shoreline
  const waterD=Math.hypot(waterEdgeD,p.y-.5);
  return {odorL:odor(aL),odorR:odor(aR),right,lightDir,threatD,obsPush:obsPush.add(wall),
    toThreat:spider.position.clone().sub(p).normalize(), waterD, waterDH, waterEdgeD,
    toWater:water.position.clone().setY(p.y).sub(p).normalize()};
}
// ---- Real spiking brain: LIF (leaky integrate-and-fire) neurons ----
// Two documented Drosophila circuits, simplified in neuron count but real in wiring logic:
//  1) Olfactory: ORN -> PN -> Kenyon cells (mushroom body) -> MBON (approach/avoid)
//  2) Giant Fiber escape: visual threat -> GF -> DLM motor neuron -> fast flee
class LIF{
  constructor(n,tau,vth,ref){this.n=n;this.tau=tau;this.vth=vth;this.ref=ref;
    this.v=new Float32Array(n);this.rt=new Int32Array(n);this.sp=new Uint8Array(n);}
  step(input,dt=1){
    for(let i=0;i<this.n;i++){
      if(this.rt[i]>0){this.rt[i]--;this.sp[i]=0;continue;}
      this.v[i]+=(-this.v[i]+input[i])/this.tau*dt;
      if(this.v[i]>=this.vth){this.sp[i]=1;this.v[i]=0;this.rt[i]=this.ref;}else this.sp[i]=0;
    }
    return this.sp;
  }
}
// FlyWire connectome edges are real; neuron dynamics, sensory inputs, and movement mapping are simplified.
let realNet = null; // {n, groups, v, rt, edgesByPost:[[pre,w],...] per post, ornIdx, kcIdx, mbonIdx, gfIdx, leftMask}
function buildRealNet(data){
  const n = data.groups.length;
  const groups = data.groups;
  let offsets=data.offsets, targets=data.targets, weights=data.weights;
  if(!offsets){
    const degree=new Uint32Array(n);
    for(const [pre] of data.edges) degree[pre]++;
    offsets=new Uint32Array(n+1);
    for(let i=0;i<n;i++) offsets[i+1]=offsets[i]+degree[i];
    targets=new Uint32Array(data.edges.length); weights=new Float32Array(data.edges.length);
    const cursor=offsets.slice(0,n);
    for(const [pre,post,w] of data.edges){const k=cursor[pre]++;targets[k]=post;weights[k]=w;}
  }
  const ornIdx=[],kcIdx=[],mbonIdx=[],gfIdx=[];
  groups.forEach((g,i)=>{if(g==='ORN')ornIdx.push(i);else if(g==='KC')kcIdx.push(i);else if(g==='MBON')mbonIdx.push(i);else if(g==='GF')gfIdx.push(i);});
  const leftMask = new Uint8Array(n); ornIdx.forEach((idx,k)=>{if(k%2===0)leftMask[idx]=1;});
  realNet = {n, groups, v:new Float32Array(n), rt:new Int32Array(n), spikes:new Uint8Array(n), prevSpikes:new Uint8Array(n),
    offsets, targets, weights, edgeCount:targets.length, ornIdx, kcIdx, mbonIdx, gfIdx, leftMask, tau:14, vth:1.0, ref:3};
  document.getElementById('brainStatus').textContent =
    `گراف FlyWire بارگذاری شد: ${n.toLocaleString()} نورون و ${realNet.edgeCount.toLocaleString()} اتصال؛ رفتار با مدل نورونی ساده‌شده ساخته می‌شود`;
  document.getElementById('kcTotal').textContent = kcIdx.length;
}
function parseFullBrainBuffer(b){
  const v=new DataView(b), u=new Uint8Array(b);
  if(String.fromCharCode(...u.subarray(0,4))!=='FLYC') throw new Error('شناسهٔ فایل درست نیست');
  const n=v.getUint32(4,true), m=v.getUint32(8,true), pad=(4-(n%4))%4;
  const expected=12+n+pad+4*(n+1)+8*m;
  if(!n || !m || expected!==b.byteLength) throw new Error('اندازهٔ فایل با اطلاعات سرآیند جور نیست');
  let p=12; const codeNames=['OTHER','ORN','PN','KC','MBON','GF'];
  const groups=Array.from(u.subarray(p,p+n),x=>codeNames[x]||'OTHER'); p+=n+pad;
  const offsets=new Uint32Array(b,p,n+1); p+=4*(n+1);
  const targets=new Uint32Array(b,p,m); p+=4*m;
  const weights=new Float32Array(b,p,m);
  if(offsets[0]!==0 || offsets[n]!==m) throw new Error('جدول اتصال‌ها ناقص یا ناسازگار است');
  return {groups,offsets,targets,weights};
}
document.getElementById('brainFile').addEventListener('change', e=>{
  const file=e.target.files[0]; if(!file) return;
  const status=document.getElementById('brainStatus');
  status.textContent=`در حال خواندن ${file.name}…`;
  const reader=new FileReader();
  reader.onload=ev=>{try{
    if(file.name.toLowerCase().endsWith('.flyc')){
      buildRealNet(parseFullBrainBuffer(ev.target.result));
    }else buildRealNet(JSON.parse(ev.target.result));
  }catch(err){status.textContent='بارگذاری ناموفق: '+err.message; alert('فایل نامعتبر: '+err.message);}};
  reader.onprogress=ev=>{if(ev.lengthComputable) status.textContent=`در حال خواندن داده: ${Math.round(ev.loaded/ev.total*100)}٪`;};
  reader.onerror=()=>{status.textContent='خواندن فایل ناموفق بود';};
  if(file.name.toLowerCase().endsWith('.flyc')) reader.readAsArrayBuffer(file); else reader.readAsText(file);
});
// On GitHub Pages, load the compact real FlyWire pathway graph by default.
if(location.protocol==='https:' || location.protocol==='http:'){
  const host=location.hostname.split('.')[0];
  const repo=location.pathname.split('/').filter(Boolean)[0] || `${host}.github.io`;
  const brainStatus=document.getElementById('brainStatus');
  brainStatus.textContent='در حال دریافت گراف سبک FlyWire…';
  fetch(`https://raw.githubusercontent.com/${host}/${repo}/main/brain/fly_brain_real.json`)
    .then(r=>{if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();})
    .then(buildRealNet)
    .catch(err=>{brainStatus.textContent='بارگذاری خودکار ناموفق بود؛ فایل گراف را دستی انتخاب کن';console.warn('GitHub brain load failed:',err);});
}
function realBrainStep(odorL,odorR,threatSignal){
  const net=realNet, input=new Float32Array(net.n);
  net.ornIdx.forEach(i=>{input[i]=(net.leftMask[i]?odorL:odorR)*1.6;});
  net.gfIdx.forEach(i=>{input[i]+=threatSignal*1.8;});
  for(let pre=0;pre<net.n;pre++) if(net.prevSpikes[pre])
    for(let k=net.offsets[pre];k<net.offsets[pre+1];k++) input[net.targets[k]]+=net.weights[k];
  for(let post=0;post<net.n;post++){
    const acc=input[post];
    if(net.rt[post]>0){net.rt[post]--;net.spikes[post]=0;continue;}
    net.v[post]+=(-net.v[post]+acc)/net.tau;
    if(net.v[post]>=net.vth){net.spikes[post]=1;net.v[post]=0;net.rt[post]=net.ref;}else net.spikes[post]=0;
  }
  net.prevSpikes.set(net.spikes);
  let steer=0; net.ornIdx.forEach(i=>{steer+=net.spikes[i]*(net.leftMask[i]?1:-1);});
  let approach=0; net.mbonIdx.forEach(i=>{approach+=net.spikes[i];});
  let escape=0; net.gfIdx.forEach(i=>{escape+=net.spikes[i];});
  let kcActive=0; net.kcIdx.forEach(i=>{kcActive+=net.spikes[i];});
  let totalSpikes=0; for(let i=0;i<net.n;i++)totalSpikes+=net.spikes[i];
  net._lastTotalSpikes=totalSpikes;
  return {steer:steer*2.2, approach, escape, kcActive, totalSpikes};
}

function rnd(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function sumArr(a){let s=0;for(const x of a)s+=x;return s;}
function brain(s){
  const threatLoom=Math.max(0,1-s.threatD/7)*st.fear;

  if(!realNet){ // no real connectome loaded yet — the fly has no brain, so it does not move
    st._kcActive=0; st._escape=0; st._totalSpikes=0;
    return V(0,0,0);
  }

  const r=realBrainStep(Math.min(1,s.odorL),Math.min(1,s.odorR),threatLoom);
  const steer=r.steer, approachSp=r.approach>0, escSp=r.escape>0, kcActive=r.kcActive;
  st._totalSpikes=r.totalSpikes;

  st._kcActive=kcActive;st._escape=escSp;
  if(st.asleep) return V(0,0,0); // resting: no locomotion until fatigue clears

  const d=V(0,0,0);
  d.addScaledVector(vel.clone().normalize(),.6);
  d.addScaledVector(s.right,-steer*3.5);
  if(st.thirst>=st.hunger){
    d.addScaledVector(s.toWater,1.2+st.thirst*2.5);      // thirst is the more urgent need right now
    if(s.waterEdgeD<3) d.y-=.8;                           // descend toward the shoreline
    if(foods.length)d.addScaledVector(nearestFood().sub(fly.position).normalize(),.3+st.hunger*.4);
  } else if(foods.length){
    const toFood=nearestFood().sub(fly.position).normalize();
    d.addScaledVector(toFood,.5+st.hunger*.9);           // hunger is more urgent
    if(approachSp)d.addScaledVector(toFood,1.3);          // extra boost on real MBON spike
    d.addScaledVector(s.toWater,.3+st.thirst*.4);
  }
  if(escSp)d.addScaledVector(s.toThreat,-4);
  d.addScaledVector(s.toThreat,-st.fear*1.5);
  d.addScaledVector(s.obsPush,2.5);
  d.addScaledVector(s.lightDir,.12);
  d.add(V(R(-.25,.25),R(-.2,.2),R(-.25,.25)));
  const tired=1-st.fatigue*.6; // slows down as fatigue rises
  return d.normalize().multiplyScalar(tired);
}
function nearestFood(){let b=foods[0];foods.forEach(f=>{if(f.position.distanceTo(fly.position)<b.position.distanceTo(fly.position))b=f});return b.position.clone();}

// ---- controls ----
const $=id=>document.getElementById(id);
$('b1').onclick=addFood;
$('b2').onclick=()=>{spider.position.copy(fly.position).add(V(R(-4,4),0,R(-4,4))).setY(1.5);};
$('b3').onclick=e=>{st.follow=!st.follow;e.target.textContent='دنبال کردن مگس: '+(st.follow?'روشن':'خاموش');};
let yaw=.8,pit=.5,dist=24,drag=null;
const cv=ren.domElement;
cv.addEventListener('pointerdown',e=>drag=[e.clientX,e.clientY]);
addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.008;pit=Math.max(.05,Math.min(1.5,pit+(e.clientY-drag[1])*.008));drag=[e.clientX,e.clientY];});
cv.addEventListener('wheel',e=>{dist=Math.max(5,Math.min(90,dist+e.deltaY*.035));e.preventDefault();},{passive:false});
function resize(){ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let last=performance.now(),t=0;
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;
  const s=sense();
  // day/night cycle (one full cycle per LIFESPAN)
  const dayPhase=(t%LIFESPAN)/LIFESPAN; // 0..1
  const daylight=Math.max(.08,Math.sin(dayPhase*Math.PI*2)*.5+.5);
  sun.position.set(Math.cos(dayPhase*Math.PI*2)*34,Math.sin(dayPhase*Math.PI*2)*24+10,-24);
  sl.position.copy(sun.position); sl.target.position.set(0,0,0);
  sl.intensity=.3+daylight*1.3; scene.getObjectByProperty('type','HemisphereLight').intensity=.25+daylight*.7;
  skyMat.uniforms.top.value.setRGB(.08+.12*daylight,.2+.22*daylight,.15+.18*daylight);
  skyMat.uniforms.bot.value.setRGB(.03+.03*daylight,.06+.05*daylight,.05+.04*daylight);
  fireflyMat.opacity=.08+(1-daylight)*.75;
  for(let i=0;i<fireflyCount;i++){const [x,y,z]=fireflyBase[i];fireflyPositions[i*3+1]=y+Math.sin(t*1.8+i)*.28;fireflyPositions[i*3]=x+Math.sin(t*.35+i*2)*.18;fireflyPositions[i*3+2]=z+Math.cos(t*.4+i)*.18;}
  fireflyGeo.attributes.position.needsUpdate=true;

  // internal state
  if(!st.asleep){
    st.hunger=Math.min(1,st.hunger+dt*.03);
    st.thirst=Math.min(1,st.thirst+dt*.022);
    st.fatigue=Math.min(1,st.fatigue+dt*.015*(1+st.fear));
  } else {
    st.fatigue=Math.max(0,st.fatigue-dt*.25); // resting recovers fatigue fast
    if(st.fatigue<=0) st.asleep=false;
  }
  if(st.fatigue>=1) st.asleep=true;
  st.age+=dt;
  const targetFear=s.threatD<7?1-s.threatD/7:0;
  st.fear+=(targetFear-st.fear)*Math.min(1,dt*4);
  // drink when near water
  if(s.waterD<2.2){ st.thirst=Math.max(0,st.thirst-dt*.8); st.drunk++; }
  // getting caught by the threat costs health
  if(s.threatD<1.1) st.health=Math.max(0,st.health-dt*.6);
  else st.health=Math.min(1,st.health+dt*.01); // slow natural recovery
  // death of old age or health loss -> respawn as next generation
  if(st.age>LIFESPAN || st.health<=0){
    st.gen++; st.age=0; st.hunger=.3; st.thirst=.2; st.fatigue=0; st.health=1; st.asleep=false;
    fly.position.set(R(-5,5),3,R(-5,5));
  }
  // move — real flies fly in straight "flight segments" and make rapid ~saccade turns
  // between them (studied behavior), rather than smoothly steering like a drone.
  const want=brain(s), speed=st.asleep?0:(2.5+st.fear*3.5)*(daylight<.25?.5:1); // slower/resting at night
  st._saccadeT=(st._saccadeT||0)-dt;
  if(st._saccadeT<=0 && !st.asleep){
    vel.lerp(want,0.9).normalize();                 // rapid snap-turn (saccade)
    st._saccadeT = st.fear>.3 ? R(.05,.12) : R(.18,.4); // faster saccades when fleeing
  }
  // tiny straight-flight jitter (real flight is not perfectly linear either)
  const jit=V(R(-1,1),R(-.4,.4),R(-1,1)).multiplyScalar(.06);
  fly.position.addScaledVector(vel.clone().add(jit).normalize(),speed*dt*(st._saccadeT<0.03?1.6:1));
  if(st.thirst>=st.hunger && !st.asleep && s.waterEdgeD<3){
    fly.position.x+=(water.position.x-fly.position.x)*Math.min(1,dt*1.5);
    fly.position.z+=(water.position.z-fly.position.z)*Math.min(1,dt*1.5);
    fly.position.y+=(.5-fly.position.y)*Math.min(1,dt*2);
  }
  fly.position.y=Math.max(.3,fly.position.y);
  fly.lookAt(fly.position.clone().add(vel));
  const fl=Math.sin(t*(reduce?4:60))*.9; wL.rotation.z=fl; wR.rotation.z=-fl;
  foods.forEach(f=>{f.position.y=f.userData.baseY+Math.sin(t*2.2+f.userData.phase)*.14;f.rotation.y+=dt*.45;});
  // eat
  for(let i=foods.length-1;i>=0;i--)if(foods[i].position.distanceTo(fly.position)<1.0){
    scene.remove(foods[i]);foods.splice(i,1);st.hunger=0;st.eaten++;addFood();}
  // spider wanders
  const sd=spTarget.clone().sub(spider.position);
  if(sd.length()<.5)spTarget=V(R(-W*.6,W*.6),1.5,R(-W*.6,W*.6));
  spider.position.addScaledVector(sd.normalize(),1.2*dt);
  spider.rotation.y=Math.atan2(sd.x,sd.z); spider.position.y=1.5+Math.sin(t*6)*.08;
  // trail
  trail.push(fly.position.clone());if(trail.length>200)trail.shift();
  tg.setFromPoints(trail);
  // camera
  if(st.follow){cam.position.set(fly.position.x+Math.sin(yaw)*Math.cos(pit)*dist,fly.position.y+Math.sin(pit)*dist,fly.position.z+Math.cos(yaw)*Math.cos(pit)*dist);cam.lookAt(fly.position);}
  else{cam.position.set(Math.sin(yaw)*Math.cos(pit)*dist*1.6,Math.sin(pit)*dist*1.6+2,Math.cos(yaw)*Math.cos(pit)*dist*1.6);cam.lookAt(0,2,0);}
  // HUD
  $('bh').style.width=st.hunger*100+'%';$('bf').style.width=st.fear*100+'%';$('ea').textContent=st.eaten;
  $('bt').style.width=st.thirst*100+'%';$('bfat').style.width=st.fatigue*100+'%';$('bhp').style.width=st.health*100+'%';
  $('gen').textContent=st.gen; $('age').textContent=st.age.toFixed(0);
  $('st').textContent=!realNet?'بدون مغز — منتظر بارگذاری JSON':st.asleep?'در حال استراحت 💤':st.fear>.35?'فرار':st.thirst>.5?'جست‌وجوی آب':st.hunger>.5?'جست‌وجوی غذا':'کاوش';
  $('kc').textContent=st._kcActive||0; $('gf').textContent=st._escape?'spike!':'-';
  $('totalSp').textContent=(realNet? (st._totalSpikes??0) : '—(مغز واقعی لود نشده)');
  ren.render(scene,cam);requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
